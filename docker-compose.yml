version: "3.9"

# Local container dev loop — run this once Docker Desktop is installed, before
# moving to the Kubernetes manifests in k8s/. Mirrors the same two components
# the spec's architecture describes: a Postgres StatefulSet-equivalent and the
# Python pipeline container.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-marketpulse}
      POSTGRES_USER: ${DB_USER:-marketpulse}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - marketpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-marketpulse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    build:
      context: .
      dockerfile: docker/pipeline.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-marketpulse}
      DB_USER: ${DB_USER:-marketpulse}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      # The image runs as non-root (UID 10001). On Docker Desktop this bind
      # mount just works; on a Linux host, make ./data/raw writable by that UID.
      - ./data/raw:/app/data/raw
    # One-shot run of the full EOD orchestrator, same entry point as the
    # CronJob. Override the command to `apply_migrations.py` / `seed_dimensions.py`
    # for setup.
    command: ["python", "scripts/run_daily_update.py"]

  webapp:
    build:
      context: .
      dockerfile: docker/webapp.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-marketpulse}
      DB_USER: ${DB_USER:-marketpulse}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-dev-only-change-me}
    ports:
      - "5050:5050"

volumes:
  marketpulse_pgdata:
