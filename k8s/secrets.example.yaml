# Copy to secrets.yaml, fill in real values, and DO NOT commit secrets.yaml
# (it's covered by k8s/.gitignore below). Applied with: kubectl apply -f k8s/secrets.yaml
# With APP_ENV=production (configmap.yaml), the webapp and the EOD job refuse to
# start while any value below is a placeholder.
apiVersion: v1
kind: Secret
metadata:
  name: marketpulse-db-credentials
  namespace: marketpulse
type: Opaque
stringData:
  DB_NAME: marketpulse
  DB_USER: marketpulse
  DB_PASSWORD: changeme
---
# Signs the webapp's session cookie (rate-limit history lives client-side in
# it - see webapp/rate_limit.py). Generate a real one with:
#   python -c "import secrets; print(secrets.token_hex(32))"
apiVersion: v1
kind: Secret
metadata:
  name: marketpulse-webapp-secret
  namespace: marketpulse
type: Opaque
stringData:
  FLASK_SECRET_KEY: changeme-generate-a-real-random-value
