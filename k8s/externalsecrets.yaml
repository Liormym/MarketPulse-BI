# Secrets come from AWS Secrets Manager via the External Secrets Operator, so
# no credential value ever lands in Git. Replaces the former secrets.example.yaml.
#
# ONE Secrets Manager secret (JSON) holds everything - it is billed per secret:
#   name: marketpulse/prod
#   {
#     "DB_NAME": "marketpulse", "DB_USER": "marketpulse", "DB_PASSWORD": "<random>",
#     "FLASK_SECRET_KEY": "<python -c 'import secrets; print(secrets.token_hex(32))'>",
#     "AWS_ACCESS_KEY_ID": "<backup bucket key>", "AWS_SECRET_ACCESS_KEY": "<backup bucket secret>",
#     "S3_BUCKET": "<bucket>", "S3_ENDPOINT": "<https://... for non-AWS S3, or empty>"
#   }
#
# The ONE thing that is created by hand (it is the key to the vault, so it
# cannot come from the vault): see k8s/README.md, "Bootstrap secret".
# Give that IAM user read-only access to the marketpulse/prod secret and nothing else.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: marketpulse
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1 # TODO: region of the marketpulse/prod secret
      auth:
        secretRef:
          accessKeyIDSecretRef: {name: aws-secrets-manager-credentials, key: access-key}
          secretAccessKeySecretRef: {name: aws-secrets-manager-credentials, key: secret-access-key}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: marketpulse-db-credentials
  namespace: marketpulse
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: aws-secrets-manager}
  target:
    name: marketpulse-db-credentials
    creationPolicy: Owner
  data:
    - {secretKey: DB_NAME, remoteRef: {key: marketpulse/prod, property: DB_NAME}}
    - {secretKey: DB_USER, remoteRef: {key: marketpulse/prod, property: DB_USER}}
    - {secretKey: DB_PASSWORD, remoteRef: {key: marketpulse/prod, property: DB_PASSWORD}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: marketpulse-webapp-secret
  namespace: marketpulse
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: aws-secrets-manager}
  target:
    name: marketpulse-webapp-secret
    creationPolicy: Owner
  data:
    - {secretKey: FLASK_SECRET_KEY, remoteRef: {key: marketpulse/prod, property: FLASK_SECRET_KEY}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: marketpulse-backup-credentials
  namespace: marketpulse
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: SecretStore, name: aws-secrets-manager}
  target:
    name: marketpulse-backup-credentials
    creationPolicy: Owner
  data:
    - {secretKey: AWS_ACCESS_KEY_ID, remoteRef: {key: marketpulse/prod, property: AWS_ACCESS_KEY_ID}}
    - {secretKey: AWS_SECRET_ACCESS_KEY, remoteRef: {key: marketpulse/prod, property: AWS_SECRET_ACCESS_KEY}}
    - {secretKey: S3_BUCKET, remoteRef: {key: marketpulse/prod, property: S3_BUCKET}}
    - {secretKey: S3_ENDPOINT, remoteRef: {key: marketpulse/prod, property: S3_ENDPOINT}}
