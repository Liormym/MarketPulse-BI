# Let's Encrypt via HTTP-01 through ingress-nginx. Start with staging (no rate
# limits, untrusted certs) to prove the flow, then flip the annotation in
# ingress.yaml to letsencrypt-prod.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: you@example.com # TODO: Let's Encrypt expiry notices
    privateKeySecretRef: {name: letsencrypt-staging-account-key}
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: you@example.com # TODO
    privateKeySecretRef: {name: letsencrypt-prod-account-key}
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
