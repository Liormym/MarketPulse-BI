# The Flask app is stateless - the refresh rate limiter lives in a signed
# session cookie and every request reads/writes only Postgres - so replicas
# need no sticky sessions or shared cache. (The cookie limiter is client-side
# and bypassable; the real per-IP limit is the refresh Ingress, ingress.yaml.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketpulse-webapp
  namespace: marketpulse
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app: marketpulse-webapp
  template:
    metadata:
      labels:
        app: marketpulse-webapp
        marketpulse/db-client: "true"
        marketpulse/egress-internet: "true" # live refresh calls Yahoo Finance
    spec:
      serviceAccountName: marketpulse-webapp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: webapp
          image: ghcr.io/liormym/marketpulse-webapp:sha-ae66c0f-amd64
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 5050}
          envFrom:
            - secretRef: {name: marketpulse-db-credentials}
            - configMapRef: {name: marketpulse-config}
          env:
            - name: FLASK_SECRET_KEY
              valueFrom: {secretKeyRef: {name: marketpulse-webapp-secret, key: FLASK_SECRET_KEY}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {cpu: "1", memory: 2Gi} # 2 gunicorn workers, each may load FinBERT for live refresh
          # Probe budget vs. gunicorn: 2 sync workers, 60 s request timeout. Two
          # concurrent live refreshes can occupy both workers for up to 60 s,
          # during which probes time out. Liveness therefore tolerates
          # 6 x 20 s = 2 min of silence before restarting; readiness drops the
          # pod from the Service after 3 misses (30 s) without restarting it.
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36 # up to 3 minutes for a cold start
          # Liveness never touches the DB (/health) - a slow Postgres must not
          # restart-loop healthy pods.
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          # Readiness DOES check the DB (/health/ready).
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      terminationGracePeriodSeconds: 70 # > gunicorn's 60 s timeout, so in-flight refreshes finish
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: marketpulse-webapp
  namespace: marketpulse
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: marketpulse-webapp
---
apiVersion: v1
kind: Service
metadata:
  name: marketpulse-webapp
  namespace: marketpulse
spec:
  type: ClusterIP # exposed through ingress.yaml
  selector:
    app: marketpulse-webapp
  ports:
    - {name: http, port: 80, targetPort: http}
