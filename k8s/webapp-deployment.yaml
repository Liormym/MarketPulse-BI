# The Flask app is fully stateless - the rate limiter lives in a signed
# session cookie (client-side), not server memory, and every request reads/
# writes only Postgres. That statelessness is what makes horizontal scaling
# here trivial: replicas just need `replicas: N`, no sticky sessions, no
# shared cache, no leader election.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketpulse-webapp
  namespace: marketpulse
spec:
  replicas: 2
  selector:
    matchLabels:
      app: marketpulse-webapp
  template:
    metadata:
      labels:
        app: marketpulse-webapp
    spec:
      containers:
        - name: webapp
          image: marketpulse-webapp:latest # build locally with docker/webapp.Dockerfile
          ports:
            - containerPort: 5050
          envFrom:
            - secretRef:
                name: marketpulse-db-credentials
            - configMapRef:
                name: marketpulse-config
          env:
            - name: FLASK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: marketpulse-webapp-secret
                  key: FLASK_SECRET_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi" # FinBERT is loaded in-process for the live-refresh path
            limits:
              cpu: "500m"
              memory: "1Gi"
          # Liveness never touches the DB (webapp/app.py's /health) - a slow
          # Postgres should not trigger a restart-loop of otherwise-healthy pods.
          livenessProbe:
            httpGet:
              path: /health
              port: 5050
            initialDelaySeconds: 10
            periodSeconds: 15
          # Readiness DOES check the DB (/health/ready) - a pod that can't
          # reach Postgres should stop receiving traffic without restarting.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5050
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: marketpulse-webapp
  namespace: marketpulse
spec:
  type: ClusterIP # front with an Ingress/LoadBalancer for external access
  selector:
    app: marketpulse-webapp
  ports:
    - port: 80
      targetPort: 5050
