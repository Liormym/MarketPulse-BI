# One identity per workload class, none of which talks to the Kubernetes API,
# so no API token is mounted into any pod.
apiVersion: v1
kind: ServiceAccount
metadata: {name: postgres, namespace: marketpulse}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: marketpulse-webapp, namespace: marketpulse}
automountServiceAccountToken: false
---
# EOD pipeline, migrate Job and pg_dump backup.
apiVersion: v1
kind: ServiceAccount
metadata: {name: marketpulse-jobs, namespace: marketpulse}
automountServiceAccountToken: false
