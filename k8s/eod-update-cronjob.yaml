# Full data refresh, three times a day (09:00, 15:00, 23:00 Israel time). Runs scripts/run_daily_update.py, which executes the
# six EOD steps in dependency order and stops at the first failure:
#   macro -> prices/news/sentiment -> technicals -> sector flows -> scores -> macro brief
# Replaces the former independent pipeline and derived-data CronJobs, which
# could recompute on stale upstream data after a failed run.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: marketpulse-eod-update
  namespace: marketpulse
spec:
  schedule: "0 9,15,23 * * *"
  timeZone: "Asia/Jerusalem" # 09:00, 15:00, 23:00 Israel time, every day; follows Israel's DST (see src/marketpulse/schedule.py)
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 900
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 604800 # keep a week of finished Jobs for debugging
      # Local run on the dev Mac: 1432 s of awake time (pipeline 368 s, technicals 802 s, scores 252 s).
      # 3600 s is ~2.5x that; re-measure on the k3s VM before go-live.
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: marketpulse-eod
            marketpulse/db-client: "true"
            marketpulse/egress-internet: "true"
        spec:
          serviceAccountName: marketpulse-jobs
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: {type: RuntimeDefault}
          restartPolicy: OnFailure
          containers:
            - name: eod-update
              image: ghcr.io/liormym/marketpulse-pipeline:sha-339e49d-amd64 # built by .github/workflows/ci.yml
              command: ["python", "scripts/run_daily_update.py"]
              envFrom:
                - secretRef:
                    name: marketpulse-db-credentials
                - configMapRef:
                    name: marketpulse-config
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
              resources:
                requests:
                  cpu: "500m"
                  memory: "256Mi" # measured peak RSS of the whole 6-step run: 196 MB (was ~1.1 GB while FinBERT was loaded)
                limits:
                  cpu: "2"
                  memory: "512Mi"
