# Spec §4: PostgreSQL as a StatefulSet bound to a PersistentVolume, so a pod
# crash never loses data (initiation doc risk #2's mitigation).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: marketpulse
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: marketpulse-db-credentials
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: marketpulse-db-credentials
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: marketpulse-db-credentials
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: marketpulse-db-credentials
                  key: DB_PASSWORD
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
              subPath: pgdata # avoids the "lost+found" non-empty-dir issue on some CSI drivers
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "$(POSTGRES_USER)"]
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: marketpulse
spec:
  clusterIP: None # headless, standard pairing for a StatefulSet
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
