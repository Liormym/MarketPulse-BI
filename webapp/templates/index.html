<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MarketPulse BI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">MP</span>
        <span class="brand-name">MarketPulse<strong>BI</strong></span>
      </div>

      <div class="ticker-picker">
        <input
          id="ticker-search"
          class="ticker-search"
          type="text"
          list="ticker-list"
          autocomplete="off"
          placeholder="Search ticker…"
          value="{{ default_ticker or '' }}"
        >
        <datalist id="ticker-list">
          {% for t in tickers %}
          <option value="{{ t.ticker }}">{{ t.name }}</option>
          {% endfor %}
        </datalist>
      </div>
    </header>

    <main class="content">
      <section class="hero">
        <div class="hero-info">
          <div class="hero-eyebrow">Now viewing</div>
          <h1 id="company-name">—</h1>
          <div class="hero-ticker" id="company-ticker">—</div>
        </div>

        <div class="score-card" id="score-card">
          <div class="score-label">Investment Score</div>
          <div class="score-value" id="score-value">—</div>
          <div class="score-tag" id="score-tag">—</div>
        </div>
      </section>

      <section class="chart-panel">
        <div class="chart-panel-header">
          <h2>Price &amp; Sentiment</h2>
          <div class="legend">
            <span class="legend-item"><i class="dot dot-price"></i>Price (USD)</span>
            <span class="legend-item"><i class="dot dot-sentiment"></i>Sentiment</span>
          </div>
        </div>
        <div class="chart-wrap">
          <canvas id="price-sentiment-chart"></canvas>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>Live price &amp; sentiment data from PostgreSQL · Investment Score is a placeholder — scoring engine not yet built</span>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
