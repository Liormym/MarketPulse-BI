<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MarketPulse BI — Live Footage Text Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pos: #16f2a3;
    --neg: #ff4d6a;
    --accent: #2f8cff;
    --accent2: #7b5cff;
    --text: #e8edf5;
    --text-muted: #c3c9d6;
    --font-display: 'Space Grotesk', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    font-family: var(--font-display);
    color: var(--text);
  }

  #top-scrim {
    position: absolute;
    left: 0; top: 0; right: 0; height: 45vh;
    background: linear-gradient(180deg,
      rgba(2,3,6,0.97) 0%,
      rgba(2,3,6,0.97) 72%,
      rgba(2,3,6,0.78) 86%,
      rgba(2,3,6,0) 100%);
    opacity: 0;
  }

  #brand-mark {
    position: absolute;
    left: 6vw; top: 3.4vh;
    display: flex; align-items: center; gap: 1.8vw;
    opacity: 0;
  }
  #brand-mark .icon {
    width: 6.6vw; height: 6.6vw;
    border-radius: 1.6vw;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-weight: 700; font-size: 2.8vw;
    box-shadow: 0 0 2.4vw rgba(47,140,255,0.6);
  }
  #brand-mark .word { font-size: 4.6vw; font-weight: 700; text-shadow: 0 2px 10px rgba(0,0,0,0.6); }
  #brand-mark .word .bi { color: var(--accent); }

  .sc-headline {
    position: absolute;
    left: 50%; top: 10.5vh;
    transform: translate(-50%, 0);
    width: 90vw;
    text-align: center;
  }
  .sc-headline .line {
    font-size: 7.6vw;
    font-weight: 700;
    line-height: 1.12;
    letter-spacing: -0.01em;
    text-shadow: 0 2px 16px rgba(0,0,0,0.65), 0 0 2.4vw rgba(0,0,0,0.5);
  }
  .sc-headline .word { display: inline-block; opacity: 0; margin-right: 0.26em; will-change: transform, opacity; }

  .sc-tag {
    position: absolute;
    left: 50%; top: 24.6vh;
    transform: translate(-50%, 0);
    width: 88vw;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 2.7vw;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--text-muted);
    text-shadow: 0 1px 8px rgba(0,0,0,0.7);
    opacity: 0;
    will-change: transform, opacity;
  }

  .sc-accent {
    position: absolute;
    left: 50%; top: 29.6vh;
    transform: translate(-50%, 0) scaleX(0);
    width: 30vw; height: 3px;
    border-radius: 3px;
    opacity: 0;
    will-change: transform, opacity;
  }
  .sc-accent.neutral { background: var(--accent); box-shadow: 0 0 1.6vw rgba(47,140,255,0.85); }
  .sc-accent.pos { background: var(--pos); box-shadow: 0 0 1.6vw rgba(22,242,163,0.85); }
  .sc-accent.neg { background: var(--neg); box-shadow: 0 0 1.6vw rgba(255,77,106,0.85); }
</style>
</head>
<body>
<div id="stage">
  <div id="top-scrim"></div>
  <div id="brand-mark">
    <div class="icon">MP</div>
    <div class="word">MarketPulse<span class="bi">BI</span></div>
  </div>
  <div id="scenes-root"></div>
</div>

<script>
function clamp01(x) { return Math.max(0, Math.min(1, x)); }
function progressOf(t, start, dur) { return dur <= 0 ? 1 : clamp01((t - start) / dur); }
function lerp(a, b, p) { return a + (b - a) * p; }
function easeOutBack(p, overshoot = 1.7) {
  const c3 = overshoot + 1;
  return 1 + c3 * Math.pow(p - 1, 3) + overshoot * Math.pow(p - 1, 2);
}

function applyEntranceExit(el, t, start, end, opts = {}) {
  const fadeIn = opts.fadeIn ?? 0.42;
  const fadeOut = opts.fadeOut ?? 0.32;
  const fromY = opts.fromY ?? 26;
  const fromScale = opts.fromScale ?? 0.92;
  const overshoot = opts.overshoot ?? 1.7;
  const centerX = opts.centerX ?? true;
  const baseX = centerX ? "-50%" : "0%";
  const extraTransform = opts.extraTransform ?? "";

  if (t < start || t > end) { el.style.opacity = 0; return; }

  if (t < start + fadeIn) {
    const p = progressOf(t, start, fadeIn);
    const eased = easeOutBack(p, overshoot);
    el.style.opacity = clamp01(p / 0.6);
    el.style.transform = `translate(${baseX}, ${lerp(fromY, 0, eased)}px) scale(${lerp(fromScale, 1, eased)}) ${extraTransform}`;
  } else if (t > end - fadeOut) {
    const p = progressOf(t, end - fadeOut, fadeOut);
    el.style.opacity = clamp01(1 - p);
    el.style.transform = `translate(${baseX}, 0px) scale(${lerp(1, 0.97, p)}) ${extraTransform}`;
  } else {
    el.style.opacity = 1;
    el.style.transform = `translate(${baseX}, 0px) scale(1) ${extraTransform}`;
  }
}

// Timeline of the live (middle) section of the reel. scripts/build_promo_reel.py builds its
// footage from the same four scenes and refuses to run if these start/end times drift apart.
const SCENES = [
  {
    start: 0.00, end: 3.50,
    headline: ["Your entire market.", "One screen."],
    tag: "US & TASE Top 5 · live macro regime",
    sentiment: "neutral",
  },
  {
    start: 3.50, end: 8.00,
    headline: ["Catch sector", "rotation early."],
    tag: "2-day & 5-day flow vs equal-weight RSP",
    sentiment: "pos",
  },
  {
    start: 8.00, end: 11.50,
    headline: ["Pure quant.", "Fully explained."],
    tag: "Every score point audited · no black box",
    sentiment: "neutral",
  },
  {
    start: 11.50, end: 15.00,
    headline: ["Your portfolio.", "Your device."],
    tag: "Portfolio tracker · USD / ILS · demo holdings",
    sentiment: "pos",
  },
];
window.TIMELINE_DURATION = SCENES[SCENES.length - 1].end;

const root = document.getElementById("scenes-root");
SCENES.forEach((sc) => {
  const headline = document.createElement("div");
  headline.className = "sc-headline";
  sc.headline.forEach((line) => {
    const lineEl = document.createElement("div");
    lineEl.className = "line";
    line.split(" ").forEach((w) => {
      const span = document.createElement("span");
      span.className = "word";
      span.textContent = w + " ";
      lineEl.appendChild(span);
    });
    headline.appendChild(lineEl);
  });
  root.appendChild(headline);
  sc._headlineEl = headline;
  sc._words = headline.querySelectorAll(".word");

  const tag = document.createElement("div");
  tag.className = "sc-tag";
  tag.textContent = sc.tag;
  root.appendChild(tag);
  sc._tagEl = tag;

  const accent = document.createElement("div");
  accent.className = "sc-accent " + sc.sentiment;
  root.appendChild(accent);
  sc._accentEl = accent;
});

window.renderAtTime = function (t) {
  const scrim = document.getElementById("top-scrim");
  applyEntranceExit(scrim, t, 0.0, window.TIMELINE_DURATION + 10, { fadeIn: 0.5, fadeOut: 0.01, fromY: 0, fromScale: 1, centerX: false });

  const brand = document.getElementById("brand-mark");
  applyEntranceExit(brand, t, 0.2, window.TIMELINE_DURATION + 10, { fadeOut: 0.01, fromY: -10, centerX: false });

  SCENES.forEach((sc) => {
    applyEntranceExit(sc._tagEl, t, sc.start + 0.12, sc.end, { fromY: 16, fromScale: 0.96, fadeIn: 0.4, fadeOut: 0.3 });
    applyEntranceExit(sc._accentEl, t, sc.start + 0.02, sc.end, {
      fromY: 0, fromScale: 1, fadeIn: 0.38, fadeOut: 0.26, overshoot: 1.2,
      extraTransform: "", centerX: true,
    });
    if (t >= sc.start && t <= sc.end) {
      const p = t < sc.start + 0.38 ? progressOf(t, sc.start + 0.02, 0.36) : (t > sc.end - 0.26 ? 1 - progressOf(t, sc.end - 0.26, 0.26) : 1);
      sc._accentEl.style.transform = `translate(-50%, 0) scaleX(${clamp01(p)})`;
    }

    const wordStart = sc.start;
    const stagger = 0.07;
    sc._words.forEach((w, i) => {
      const ws = wordStart + i * stagger;
      if (t < ws) { w.style.opacity = 0; return; }
      applyEntranceExit(w, t, ws, sc.end, { fromY: 24, fromScale: 0.9, fadeIn: 0.3, fadeOut: 0.28, centerX: false });
    });
  });
};

window.renderAtTime(0);
</script>
</body>
</html>
