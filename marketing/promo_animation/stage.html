<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MarketPulse BI — Promo Animation Stage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090b10;
    --bg2: #05070d;
    --pos: #16f2a3;
    --neg: #ff4d6a;
    --accent: #2f8cff;
    --accent2: #7b5cff;
    --text: #e8edf5;
    --text-muted: #8892a3;
    --font-display: 'Space Grotesk', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(ellipse at 50% 30%, var(--bg) 0%, var(--bg2) 70%, #000 100%);
    font-family: var(--font-display);
    color: var(--text);
  }

  /* ---------- Background number-rush ---------- */
  #number-rush {
    position: absolute;
    inset: 0;
    overflow: hidden;
    opacity: 0.32;
    filter: blur(0.4px);
  }
  .rush-col {
    position: absolute;
    top: 0;
    width: 8.5vw;
    font-family: var(--font-mono);
    font-size: 2.6vw;
    font-weight: 700;
    line-height: 1.9;
    text-align: center;
    white-space: nowrap;
  }
  .rush-row.pos { color: var(--pos); }
  .rush-row.neg { color: var(--neg); }

  /* ---------- Shared text layers ---------- */
  .word {
    display: inline-block;
    opacity: 0;
    will-change: transform, opacity;
  }
  #headline-1, #headline-2 {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 92vw;
    text-align: center;
    font-size: 10.2vw;
    font-weight: 700;
    line-height: 1.08;
    letter-spacing: -0.01em;
  }
  #headline-2 { color: var(--pos); text-shadow: 0 0 3vw rgba(22,242,163,0.45); }

  /* ---------- Chart panel ---------- */
  #chart-panel {
    position: absolute;
    left: 50%; top: 50%;
    width: 8px; height: 8px;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    background: #10141d;
    border: 1px solid rgba(47,140,255,0.5);
    box-shadow: 0 0 40px rgba(47,140,255,0.35), inset 0 0 30px rgba(47,140,255,0.08);
    opacity: 0;
    overflow: visible;
  }
  #chart-svg {
    position: absolute;
    inset: 6%;
    width: 88%;
    height: 88%;
    overflow: visible;
  }
  #chart-path {
    fill: none;
    stroke: var(--pos);
    stroke-width: 6;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 14px rgba(22,242,163,0.85)) drop-shadow(0 0 30px rgba(22,242,163,0.4));
  }
  #chart-fill { fill: url(#chartGradient); opacity: 0; }
  #score {
    position: absolute;
    right: 4%;
    top: 8%;
    font-family: var(--font-mono);
    font-size: 5.6vw;
    font-weight: 700;
    color: var(--pos);
    text-shadow: 0 0 2.2vw rgba(22,242,163,0.85), 0 0 5vw rgba(22,242,163,0.4);
    opacity: 0;
    will-change: transform, opacity;
  }

  /* ---------- Red flash / scanline ---------- */
  #red-flash {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 50%, rgba(255,77,106,0.55) 0%, rgba(255,77,106,0.0) 70%);
    opacity: 0;
    pointer-events: none;
  }
  #scanline {
    position: absolute; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, transparent, var(--neg), transparent);
    box-shadow: 0 0 20px 4px rgba(255,77,106,0.8);
    opacity: 0;
    top: -3px;
  }

  /* ---------- Risk badge ---------- */
  #risk-badge {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    gap: 2.2vw;
    padding: 2.6vw 5vw;
    border-radius: 999px;
    background: rgba(255,77,106,0.12);
    border: 1.5px solid rgba(255,77,106,0.55);
    opacity: 0;
    will-change: transform, opacity;
  }
  #risk-badge .glyph { font-size: 5vw; }
  #risk-badge .label {
    font-family: var(--font-mono);
    font-size: 4.1vw;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--neg);
    text-shadow: 0 0 1.6vw rgba(255,77,106,0.7);
    white-space: nowrap;
  }

  /* ---------- Logo + tagline ---------- */
  #logo-block {
    position: absolute;
    left: 50%; top: 30%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 100vw;
  }
  #logo-mark-row {
    display: inline-flex;
    align-items: center;
    gap: 2.4vw;
    opacity: 0;
    will-change: transform, opacity;
  }
  #logo-icon {
    width: 9.5vw; height: 9.5vw;
    border-radius: 2.2vw;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 4vw;
    box-shadow: 0 0 3vw rgba(47,140,255,0.55);
  }
  #logo-text {
    font-size: 8.4vw;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  #logo-text .bi { color: var(--accent); }
  #logo-glow-ring {
    position: absolute;
    left: 50%; top: 30%;
    transform: translate(-50%, -50%);
    width: 4vw; height: 4vw;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.9), rgba(47,140,255,0) 70%);
    opacity: 0;
    pointer-events: none;
  }
  #tagline {
    margin-top: 2.2vw;
    font-family: var(--font-mono);
    font-size: 3.4vw;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
    text-shadow: 0 0 1.4vw rgba(47,140,255,0.35);
  }
  #tagline .word { color: var(--text); }

  #final-fade {
    position: absolute; inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="number-rush"></div>

  <div id="headline-1">
    <span class="word" data-w="0">Data</span>
    <span class="word" data-w="1">is</span>
    <span class="word" data-w="2">abundant.</span>
  </div>
  <div id="headline-2">
    <span class="word" data-w="0">Synthesis</span>
    <span class="word" data-w="1">is</span>
    <span class="word" data-w="2">rare.</span>
  </div>

  <div id="chart-panel">
    <svg id="chart-svg" viewBox="0 0 600 300" preserveAspectRatio="none">
      <defs>
        <linearGradient id="chartGradient" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#16f2a3" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#16f2a3" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path id="chart-fill" d=""/>
      <path id="chart-path" d="M 10 230 L 70 210 L 120 240 L 180 160 L 230 190 L 290 110 L 340 140 L 400 70 L 450 95 L 510 40 L 560 55 L 590 25"/>
    </svg>
    <div id="score">89</div>
  </div>

  <div id="red-flash"></div>
  <div id="scanline"></div>

  <div id="risk-badge">
    <span class="glyph">⚠</span>
    <span class="label">SYSTEMIC RISK: ELEVATED</span>
  </div>

  <div id="logo-glow-ring"></div>
  <div id="logo-block">
    <div id="logo-mark-row">
      <div id="logo-icon">MP</div>
      <div id="logo-text">MarketPulse<span class="bi">BI</span></div>
    </div>
    <div id="tagline">
      <span class="word" data-w="0">Quantitative</span>
      <span class="word" data-w="1">Decision</span>
      <span class="word" data-w="2">Support</span>
      <span class="word" data-w="3">System</span>
    </div>
  </div>

  <div id="final-fade"></div>
</div>

<script>
// ============================================================
// Deterministic animation engine - every visual state is a pure
// function of `t` (seconds since the start of the 15s timeline).
// Playwright calls window.renderAtTime(t) once per output frame;
// nothing here depends on wall-clock time or requestAnimationFrame.
// ============================================================

function clamp01(x) { return Math.max(0, Math.min(1, x)); }
function progressOf(t, start, dur) { return clamp01((t - start) / dur); }
function lerp(a, b, p) { return a + (b - a) * p; }

// Overshoot-bounce ("back") ease-out: f(0)=0, f(1)=1, overshoots
// above 1 mid-curve then settles - this is THE motion signature
// used for every entrance in the piece.
function easeOutBack(p, overshoot = 1.7) {
  const c3 = overshoot + 1;
  return 1 + c3 * Math.pow(p - 1, 3) + overshoot * Math.pow(p - 1, 2);
}
function easeInCubic(p) { return p * p * p; }
function easeOutCubic(p) { return 1 - Math.pow(1 - p, 3); }
function easeInOutCubic(p) {
  return p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
}
// Eased draw progress with two small decaying "overdraw" wiggles,
// standing in for the chart line overshooting slightly at its peaks
// before settling - momentum, applied to a path reveal instead of a
// transform.
function drawEaseWithWiggle(p) {
  const base = easeOutCubic(p);
  const wiggle = Math.sin(p * Math.PI * 5) * 0.035 * (1 - p) * (p > 0.15 ? 1 : 0);
  return clamp01(base + wiggle);
}

// Seeded PRNG (mulberry32) so the background number-rush is
// identical frame-for-frame across re-renders.
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------- Generic "whole fade + up-drift + overshoot" entrance ----------
// This is THE grammar used everywhere: element is fully built, then
// fades in while drifting up from a small offset and overshooting
// past its resting scale/position before settling. Never a reveal
// masked behind an edge.
// `centerXY: true` composes with an element's own `left:50%; top:50%;
// transform: translate(-50%,-50%)` centering (instead of clobbering it,
// which was pushing the risk badge off-screen to the right - its base
// centering transform was being overwritten wholesale by this function).
function transformFor(y, scale, centerXY) {
  return centerXY
    ? `translate(-50%, calc(-50% + ${y}px)) scale(${scale})`
    : `translateY(${y}px) scale(${scale})`;
}

function applyEntrance(el, t, start, dur, opts = {}) {
  const fromY = opts.fromY ?? 26;
  const fromScale = opts.fromScale ?? 0.92;
  const opacityFrac = opts.opacityFrac ?? 0.55; // fraction of dur to reach full opacity
  const overshoot = opts.overshoot ?? 1.7;
  const centerXY = opts.centerXY ?? false;

  const p = progressOf(t, start, dur);
  if (t < start) {
    el.style.opacity = 0;
    el.style.transform = transformFor(fromY, fromScale, centerXY);
    return;
  }
  const eased = easeOutBack(p, overshoot);
  const y = lerp(fromY, 0, eased);
  const scale = lerp(fromScale, 1, eased);
  const opacity = clamp01(p / opacityFrac);
  el.style.opacity = opacity;
  el.style.transform = transformFor(y, scale, centerXY);
}

function applyExitDown(el, t, start, dur, opts = {}) {
  const toY = opts.toY ?? 22;
  const centerXY = opts.centerXY ?? false;
  const p = progressOf(t, start, dur);
  if (t < start) return; // leave whatever state it was already in
  const eased = easeInCubic(p);
  el.style.opacity = clamp01(1 - p * 1.15);
  el.style.transform = transformFor(lerp(0, toY, eased), lerp(1, 0.97, eased), centerXY);
}

// ---------- Background number-rush ----------
const RUSH_COLS = 11;
const RUSH_ROWS = 26;
const TICKERS = ["AAPL","NBIS","XLK","SATL","RBRK","GLW","MSFT","AXTI","BTC","SPX","QCOM","DELL"];
const rushRng = mulberry32(1337);
const rushEl = document.getElementById("number-rush");
const rushColumns = [];

function buildNumberRush() {
  const colWidth = 100 / RUSH_COLS;
  for (let c = 0; c < RUSH_COLS; c++) {
    const col = document.createElement("div");
    col.className = "rush-col";
    col.style.left = (c * colWidth + rushRng() * 2) + "vw";
    const rowHeight = 5.4; // vh per row, matches line-height*font-size roughly
    const rows = [];
    for (let r = 0; r < RUSH_ROWS; r++) {
      const row = document.createElement("div");
      const isPos = rushRng() > 0.45;
      row.className = "rush-row " + (isPos ? "pos" : "neg");
      const kind = rushRng();
      let text;
      if (kind < 0.4) {
        text = (isPos ? "+" : "-") + (rushRng() * 9 + 0.1).toFixed(2) + "%";
      } else if (kind < 0.7) {
        text = "$" + (rushRng() * 400 + 10).toFixed(2);
      } else {
        text = TICKERS[Math.floor(rushRng() * TICKERS.length)];
      }
      row.textContent = text;
      col.appendChild(row);
      rows.push(row);
    }
    rushEl.appendChild(col);
    rushColumns.push({ el: col, speed: 3.2 + rushRng() * 2.4, phase: rushRng() * 100, totalHeight: RUSH_ROWS * rowHeight });
  }
}
buildNumberRush();

function renderNumberRush(t, opts) {
  const speedMul = opts.speedMul;
  const opacity = opts.opacity;
  rushEl.style.opacity = opacity;
  for (const col of rushColumns) {
    const offset = ((t + col.phase) * col.speed * speedMul) % col.totalHeight;
    col.el.style.transform = `translateY(${offset - col.totalHeight}vh)`;
  }
}

// ---------- Scene word lists ----------
const headline1Words = document.querySelectorAll("#headline-1 .word");
const headline2Words = document.querySelectorAll("#headline-2 .word");
const taglineWords = document.querySelectorAll("#tagline .word");

const chartPanel = document.getElementById("chart-panel");
const chartPath = document.getElementById("chart-path");
const chartFill = document.getElementById("chart-fill");
const scoreEl = document.getElementById("score");
const redFlash = document.getElementById("red-flash");
const scanline = document.getElementById("scanline");
const riskBadge = document.getElementById("risk-badge");
const logoMarkRow = document.getElementById("logo-mark-row");
const logoGlowRing = document.getElementById("logo-glow-ring");
const finalFade = document.getElementById("final-fade");

const CHART_PATH_LEN = chartPath.getTotalLength();
chartPath.style.strokeDasharray = CHART_PATH_LEN;
chartFill.setAttribute("d", `M 10 230 L 70 210 L 120 240 L 180 160 L 230 190 L 290 110 L 340 140 L 400 70 L 450 95 L 510 40 L 560 55 L 590 25 L 590 300 L 10 300 Z`);

// ============================================================
// Master render function
// ============================================================
window.renderAtTime = function (t) {

  // ---------------- Scene 1: 0.00 - 3.00s ----------------
  const s1Active = t < 3.55; // number-rush + headlines relevant window (incl. suck-out tail)
  if (t <= 3.35) {
    renderNumberRush(t, { speedMul: 1, opacity: 0.32 });
  }

  // Headline 1 words: staggered whole-entrance
  const h1Starts = [0.60, 0.80, 1.00];
  headline1Words.forEach((w, i) => applyEntrance(w, t, h1Starts[i], 0.34, { fromY: 30, fromScale: 0.9 }));
  // Slam punch + hard cut just before headline 2
  const h1 = document.getElementById("headline-1");
  if (t >= 1.55 && t < 1.70) {
    const p = progressOf(t, 1.55, 0.15);
    const punch = 1 + 0.12 * Math.sin(p * Math.PI); // quick scale pulse up and back
    h1.style.transform = `translate(-50%, -50%) scale(${punch})`;
    h1.style.filter = p > 0.5 ? "hue-rotate(15deg) saturate(1.4)" : "none";
  } else if (t >= 1.70) {
    h1.style.opacity = 0; // hard cut away
  } else {
    h1.style.transform = "translate(-50%, -50%) scale(1)";
  }

  // Headline 2 words
  const h2Starts = [1.70, 1.83, 1.96];
  headline2Words.forEach((w, i) => applyEntrance(w, t, h2Starts[i], 0.28, { fromY: 30, fromScale: 0.9 }));
  const h2 = document.getElementById("headline-2");
  if (t < 1.70) {
    h2.style.opacity = 0;
  } else if (t < 3.00) {
    h2.style.opacity = 1;
    // slow breathing glow during the hold
    const glow = 3 + Math.sin((t - 1.96) * 3.0) * 0.6;
    h2.style.textShadow = `0 0 ${glow}vw rgba(22,242,163,0.45)`;
  }

  // ---------------- Scene 1 -> 2 transition: suck-out (3.00 - 3.35) ----------------
  if (t >= 3.00 && t < 3.35) {
    const p = progressOf(t, 3.00, 0.35);
    const eased = easeInCubic(p);
    h2.style.transform = `translate(-50%, -50%) scale(${lerp(1, 0.03, eased)})`;
    h2.style.opacity = 1 - eased;
    h2.style.filter = `blur(${eased * 6}px)`;
    renderNumberRush(t, { speedMul: 1 + eased * 6, opacity: 0.32 * (1 - eased) });
  } else if (t >= 3.35) {
    h2.style.opacity = 0;
    rushEl.style.opacity = 0;
  }

  // ---------------- Scene 2: 3.35 - 7.00s ----------------
  // Chart panel morph: seed dot -> rounded panel
  if (t >= 3.35 && t < 7.00) {
    const p = progressOf(t, 3.55, 1.05);
    const eased = easeOutBack(p, 1.4);
    const w = lerp(8, window.innerWidth * 0.74, clamp01(eased));
    const h = lerp(8, window.innerHeight * 0.30, clamp01(eased));
    const radius = lerp(50, 3, clamp01(p)); // % -> vw-ish via CSS below
    chartPanel.style.width = w + "px";
    chartPanel.style.height = h + "px";
    chartPanel.style.borderRadius = (t < 3.55 ? 50 : lerp(50, 3, clamp01(p))) + "%";
    chartPanel.style.opacity = t < 3.55 ? 0 : clamp01(p / 0.3);
  }
  if (t < 3.55) { chartPanel.style.opacity = 0; }

  // Chart line self-draw: 4.60 - 6.20
  if (t >= 4.60) {
    const p = progressOf(t, 4.60, 1.60);
    const drawP = drawEaseWithWiggle(p);
    const offset = CHART_PATH_LEN * (1 - drawP);
    chartPath.style.strokeDashoffset = offset;
    chartFill.style.opacity = clamp01(drawP) * 0.9;
  } else {
    chartPath.style.strokeDashoffset = CHART_PATH_LEN;
    chartFill.style.opacity = 0;
  }

  // Score "89": 6.20 - 6.55 entrance, glow bloom on landing
  if (t >= 6.20) {
    applyEntrance(scoreEl, t, 6.20, 0.35, { fromY: 22, fromScale: 0.8, opacityFrac: 0.4 });
    const bloomP = progressOf(t, 6.45, 0.35);
    const bloom = Math.sin(bloomP * Math.PI) * 1.6;
    scoreEl.style.textShadow = `0 0 ${2.2 + bloom}vw rgba(22,242,163,0.9), 0 0 ${5 + bloom * 2}vw rgba(22,242,163,0.45)`;
  } else {
    scoreEl.style.opacity = 0;
  }

  // Idle shimmer on the chart line + panel during the 6.55-7.00 hold
  if (t >= 6.55 && t < 7.00) {
    const shimmer = 12 + Math.sin((t - 6.55) * 10) * 4;
    chartPath.style.filter = `drop-shadow(0 0 ${shimmer}px rgba(22,242,163,0.85)) drop-shadow(0 0 30px rgba(22,242,163,0.4))`;
  }

  // Fade out the whole chart scene right at the 7.00s cut
  if (t >= 6.85 && t < 7.15) {
    const p = progressOf(t, 6.85, 0.30);
    chartPanel.style.filter = `brightness(${lerp(1, 0.3, p)}) saturate(${lerp(1, 0.2, p)})`;
  }
  if (t >= 7.15) {
    chartPanel.style.opacity = 0;
    scoreEl.style.opacity = 0;
  }

  // ---------------- Scene 3: 7.00 - 10.00s ----------------
  // Red flash spike-decay
  if (t >= 7.00 && t < 7.15) {
    const p = progressOf(t, 7.00, 0.15);
    redFlash.style.opacity = Math.sin(p * Math.PI) * 0.9; // fast in, fast out
  } else {
    redFlash.style.opacity = 0;
  }
  // Scanline sweep
  if (t >= 7.15 && t < 7.35) {
    const p = progressOf(t, 7.15, 0.20);
    scanline.style.top = lerp(0, 100, p) + "vh";
    scanline.style.opacity = Math.sin(p * Math.PI);
  } else {
    scanline.style.opacity = 0;
  }
  // Risk badge: whole-unit entrance 7.35-7.75, heartbeat pulse hold, fade-out 9.70-10.00
  if (t >= 7.35 && t < 9.70) {
    applyEntrance(riskBadge, t, 7.35, 0.40, { fromY: 24, fromScale: 0.9, centerXY: true });
    if (t >= 7.75) {
      const pulse = Math.abs(Math.sin((t - 7.75) * (Math.PI / 0.95))); // ~2 pulses over ~1.9s
      const glowPx = 14 + pulse * 22;
      riskBadge.style.boxShadow = `0 0 ${glowPx}px rgba(255,77,106,${0.35 + pulse * 0.35})`;
      riskBadge.style.borderColor = `rgba(255,77,106,${0.5 + pulse * 0.4})`;
    }
  } else if (t >= 9.70 && t < 10.00) {
    applyExitDown(riskBadge, t, 9.70, 0.30, { toY: 20, centerXY: true });
  } else if (t < 7.35 || t >= 10.00) {
    riskBadge.style.opacity = 0;
  }

  // ---------------- Scene 4: 10.00 - 15.00s ----------------
  if (t >= 10.00) {
    renderNumberRush(t, { speedMul: 0.35, opacity: 0.10 });
  }
  if (t >= 10.10) {
    applyEntrance(logoMarkRow, t, 10.10, 0.75, { fromY: 30, fromScale: 0.88, overshoot: 1.9, opacityFrac: 0.45 });
    // glow bloom-flash ring right on landing (~10.85)
    const ringP = progressOf(t, 10.55, 0.55);
    if (ringP > 0 && ringP < 1) {
      const ringEase = easeOutCubic(ringP);
      const size = lerp(4, 60, ringEase);
      logoGlowRing.style.width = size + "vw";
      logoGlowRing.style.height = size + "vw";
      logoGlowRing.style.opacity = (1 - ringEase) * 0.5;
    } else {
      logoGlowRing.style.opacity = 0;
    }
  } else {
    logoMarkRow.style.opacity = 0;
    logoGlowRing.style.opacity = 0;
  }

  const tagStarts = [10.85, 11.05, 11.20, 11.35];
  taglineWords.forEach((w, i) => applyEntrance(w, t, tagStarts[i], 0.30, { fromY: 18, fromScale: 0.92 }));

  // Gentle breathing glow during the long hold
  if (t >= 11.55 && t < 14.30) {
    const breathe = Math.sin((t - 11.55) * (Math.PI / 1.5));
    document.getElementById("logo-icon").style.boxShadow = `0 0 ${3 + breathe * 1.4}vw rgba(47,140,255,${0.55 + breathe * 0.2})`;
  }

  // Final fade to black
  if (t >= 14.30) {
    const p = progressOf(t, 14.30, 0.70);
    finalFade.style.opacity = easeInOutCubic(p);
  } else {
    finalFade.style.opacity = 0;
  }
};

// Initial paint at t=0 so a stray screenshot before the first
// renderAtTime call never shows unstyled/default state.
window.renderAtTime(0);
</script>
