name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a PR supersedes its run in progress. Runs on main are never
# cancelled mid-flight, so an image push can't be cut off half way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marketpulse
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: marketpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketpulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: marketpulse
      DB_USER: marketpulse
      DB_PASSWORD: ci-postgres-password

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Both Dockerfiles pin the same base image
        run: |
          webapp=$(grep -m1 '^ARG PYTHON_IMAGE=' docker/webapp.Dockerfile)
          pipeline=$(grep -m1 '^ARG PYTHON_IMAGE=' docker/pipeline.Dockerfile)
          echo "webapp:   $webapp"
          echo "pipeline: $pipeline"
          test -n "$webapp" && test "$webapp" = "$pipeline"
          echo "$webapp" | grep -q '@sha256:'

      - name: Install dependencies (CPU-only torch, same as the images)
        run: |
          pip install "torch==2.3.1+cpu" \
            --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          pip install -r requirements-dev.txt

      - name: Migrate and seed the database
        run: |
          python scripts/apply_migrations.py
          python scripts/seed_dimensions.py

      # Tests marked populated_db need real backfilled market data and live
      # Yahoo access, which a fresh CI database does not have.
      - name: Run tests
        run: python -m pytest -q -m "not populated_db"

  images:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [webapp, pipeline]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Registry paths must be lowercase; GitHub owner names may not be.
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/marketpulse-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: sha-<short> on every push, plus "main" for the default branch.
      # The -amd64 suffix names the architecture explicitly (the cluster's nodes).
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: |
            suffix=-amd64
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable={{is_default_branch}}

      # Build once into the local Docker engine so it can be smoke-tested
      # before anything is pushed.
      - name: Build (linux/amd64)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: marketpulse-${{ matrix.image }}:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      - name: Report image size
        run: |
          size=$(docker image inspect marketpulse-${{ matrix.image }}:ci --format '{{.Size}}')
          echo "### ${{ matrix.image }} image: $(( size / 1024 / 1024 )) MiB" >> "$GITHUB_STEP_SUMMARY"

      # --network none: proves FinBERT loads from the baked-in cache and the
      # image never reaches out to Hugging Face at runtime.
      - name: Smoke test - non-root, CPU torch, FinBERT works offline
        run: |
          docker run --rm --network none marketpulse-${{ matrix.image }}:ci python -c "
          import os, torch
          assert os.getuid() == 10001, f'expected uid 10001, got {os.getuid()}'
          assert '+cpu' in torch.__version__ and torch.version.cuda is None, torch.__version__
          from marketpulse.sentiment.finbert import classify
          result = classify('Company reports record profits and raises full-year guidance')
          print(torch.__version__, result)
          assert result is not None and result.category == 'Positive', result
          "

      - name: Smoke test - webapp starts in production mode
        if: matrix.image == 'webapp'
        run: |
          secret=$(python3 -c "import secrets; print(secrets.token_hex(32))")
          docker run -d --name smoke -p 5050:5050 \
            -e APP_ENV=production -e DB_PASSWORD=ci-smoke-password -e FLASK_SECRET_KEY="$secret" \
            marketpulse-webapp:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5050/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs smoke
          exit 1

      - name: Smoke test - pipeline image can import every EOD step and write its data dir
        if: matrix.image == 'pipeline'
        run: |
          docker run --rm --network none marketpulse-pipeline:ci python -c "
          import importlib.util, pathlib
          import marketpulse.pipeline
          for script in ['run_daily_update', 'compute_stock_technicals', 'compute_sector_flows',
                         'compute_investment_scores', 'fetch_macro_indicators']:
              spec = importlib.util.spec_from_file_location(script, f'/app/scripts/{script}.py')
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              print('imports ok:', script)
          p = pathlib.Path('/app/data/raw/.write-test'); p.write_text('x'); p.unlink(); print('data/raw writable')
          "

      - name: Push (linux/amd64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
